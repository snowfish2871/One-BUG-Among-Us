// Gradle init script that prints the project's classpaths, so the runtime
// harness can be launched with a plain `java` command against the real
// compiled mod classes (NeoForge userdev plus every dependency) without
// starting Minecraft.
//
// Usage:
//   ./gradlew -I common/tools/cp-init.gradle printClasspaths --offline -q
//
// The verification script in README.md consumes the two lines it prints.
allprojects {
    tasks.register('printClasspaths') {
        doLast {
            def compile = project.sourceSets?.main?.compileClasspath
            def runtime = project.sourceSets?.main?.runtimeClasspath
            println "COMPILE_CP=" + (compile == null ? '' : compile.asPath)
            println "RUNTIME_CP=" + (runtime == null ? '' : runtime.asPath)
        }
    }
}
