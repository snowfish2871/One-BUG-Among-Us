# Gradle itself
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# ---------------------------------------------------------------------------
# Minecraft / NeoForge target
# ---------------------------------------------------------------------------
minecraft_version=1.21.1
# 声明覆盖整个 1.21.x。实际编译和实机验证是在 1.21.1 上做的，
# 其余小版本靠"只用跨版本稳定的 API"来保证，详见 README 的兼容性一节
minecraft_version_range=[1.21,1.22)
neo_version=21.1.256
# NeoForge 在每个 1.21.x 小版本上都有自己的 21.x 线，所以给一个宽松下限
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Parchment mappings (readable parameter names). Comment out both lines to fall
# back to official Mojang mappings only.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# ---------------------------------------------------------------------------
# Mod metadata
# ---------------------------------------------------------------------------
# modId 保持短而稳定，改动它会让已有的报告文件名和配置失效
mod_id=oba
mod_name=One BUG Among Us
mod_abbr=OBA
mod_license=MIT
mod_version=1.0.0
mod_group_id=dev.oba
mod_authors=OBA contributors
mod_description=One BUG Among Us (OBA) - a crash and error diagnostician for NeoForge. Watches the log, the game process and the mod list, then names the exact mod file responsible for a failure, the class, method and line where it broke, and what every mod was doing in the moments before it. Also detects MCreator-generated mods and Sodium/Iris forks. Report only: never modifies, disables or deletes anything.
