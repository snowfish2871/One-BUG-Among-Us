# Gradle 自身
org.gradle.jvmargs=-Xmx3G
# 26.2 要 Java 25 编译，这台机器上装在 D 盘（Zulu 25 没有装进 Program Files）
org.gradle.java.installations.paths=D\:\\jdk\\zulu25.36.205-ca-jdk25.0.4.1-win_x64

# ===========================================================================
# 26.2 轨道（NeoForge）
# ===========================================================================

minecraft_version=26.2
# 只声明 26.2 这一个补丁版本：26.x 的版本号按年份走，小版本之间的内部改动
# 还没有像 1.21.x 那样被验证过，宁可把话说窄一点
minecraft_version_range=[26.2,26.3)
neo_version=26.2.0.93
neo_version_range=[26.2.0,)
# NeoForge 26.2 自己的描述文件写的是 [3,)。这里给 [1,)，让语言加载器的
# 判定范围更宽一些 —— javafml 的规范版本在各代之间只增不减
loader_version_range=[1,)

# 产物文件名里带上目标版本，免得几个轨道的 jar 分不清
archive_suffix=mc26.2

# ---------------------------------------------------------------------------
# 模组元数据
# ---------------------------------------------------------------------------
mod_id=oba
mod_name=One BUG Among Us
mod_abbr=OBA
mod_license=GPL-3.0-only
mod_version=1.1.0
mod_group_id=dev.oba
mod_authors=OBA contributors
mod_description=One BUG Among Us (OBA) - a crash and error diagnostician for NeoForge. Watches the log, the game process and the mod list, then names the exact mod file responsible for a failure, the class, method and line where it broke, and what every mod was doing in the moments before it. Also detects MCreator-generated mods and Sodium/Iris forks. Report only: never modifies, disables or deletes anything.
