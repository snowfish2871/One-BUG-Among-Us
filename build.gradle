// 26.2-forge 轨道的构建脚本。
//
// 这条轨道用 ForgeGradle 7：它会把 Minecraft 反混淆成能对着写代码的名字，再编译本目录的源码。
// 下面这一段照着 Forge 26.2 官方 MDK（forge-26.2-65.1.5-mdk.zip）的 build.gradle 抄的，
// 只保留了出包需要的那部分：runs 那些开发用配置没搬过来。
//
// Java 与 Forge 版本见 gradle.properties。
// 源码就在本目录的 src/main 下（共享代码的副本，加上 src/loader/forge262 的适配实现），
// 这份构建是自包含的。
//
// 构建：./gradlew -p versions/26.2-forge jar

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    // FG7 的地址是 [7.0.17,8)：26.2 的 MDK 用的就是这个区间
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = mod_version
group = mod_group_id

// java 插件已经带上 base，archivesName 直接可用；版本号由 Gradle 的 version 接在末尾
base {
    archivesName = "${mod_id}-${archive_suffix}"
}

// Mojang 从 26.1 起给终端用户发的是 Java 25，编译目标也跟着 25
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// 源码就在本目录的 src/main 下，这份构建是自包含的。
sourceSets {
    main {
        resources {
            // 描述文件源名叫 mods-forge.toml，免得和别的加载器那份撞名
            exclude 'META-INF/mods.toml'
            exclude 'META-INF/neoforge.mods.toml'
        }
    }
}

// FG7 把 runs 的写法换成了 configureEach + workingDir（旧版是 workingDirectory）。
// 这里只需要给开发用的 run 指个目录，出包用不到，但留着方便 runClient。
minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
        }
        register('client')
        register('server') {
            args '--nogui'
        }
    }
}

repositories {
    // 三行都照 MDK：mavenizer 是自己产出的依赖源，后两个是 Forge 与它的库镜像
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    // FG7 里 Minecraft / Forge 不再是 minecraft 配置，而是一个普通依赖
    implementation minecraft.dependency("net.minecraftforge:forge:${forge_version}")
}

// 把 ${...} 占位符换成这条轨道自己的值
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    // 源文件叫 mods-forge.toml（几条 Forge 轨道共用一份，内容全是占位符），
    // 落到 jar 里必须叫 mods.toml
    filesMatching(['META-INF/mods-forge.toml']) {
        name = 'mods.toml'
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                'Main-Class'              : 'dev.oba.Launcher',
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// 1.20.4 及更早的 Forge 运行时用 SRG 名字，编译出来的官方名必须 reobf 一次；
// Forge 1.20.5 起取消了这个步骤，FG 也不再创建 reobfJar 任务。按任务是否存在决定。
afterEvaluate {
    def reobf = tasks.findByName('reobfJar')
    if (reobf != null) {
        reobf.dependsOn 'jar'
        tasks.named('jar') { finalizedBy reobf }
    }
}

// 游戏外也能直接用这个 jar 跑命令行。命令名和 NeoForge 那几条轨道一致。
tasks.register('runCli', JavaExec) {
    group = 'oba'
    description = '在游戏外跑命令行诊断'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.oba.Launcher'
    systemProperty 'oba.mode', 'cli'
    setArgs((project.findProperty('cliArgs') ?: 'help').toString().split(' ').toList())
}

tasks.register('dist') {
    group = 'oba'
    description = '构建这条轨道的 jar 并打印路径'
    dependsOn 'jar'
    doLast {
        println "OBA ${mod_version} for Minecraft ${minecraft_version_range} on Forge ${forge_version}"
        println "  -> ${tasks.jar.archiveFile.get().asFile.absolutePath}"
    }
}
