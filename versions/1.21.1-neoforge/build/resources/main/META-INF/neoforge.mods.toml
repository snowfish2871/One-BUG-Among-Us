description='''One BUG Among Us (OBA) - a crash and error diagnostician for NeoForge. Watches the log, the game process and the mod list, then names the exact mod file responsible for a failure, the class, method and line where it broke, and what every mod was doing in the moments before it. Also detects MCreator-generated mods and Sodium/Iris forks. Report only: never modifies, disables or deletes anything.'''

