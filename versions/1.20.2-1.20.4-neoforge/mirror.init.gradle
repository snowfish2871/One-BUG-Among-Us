// 把所有指向 maven.neoforged.net 的仓库请求改写到官方 CDN 镜像。
//
// 为什么需要它：开发机上 maven.neoforged.net 连不通，NeoGradle 插件内部会访问它，
// 构建就卡在配置阶段。镜像 neoforged.forgecdn.net 的路径结构完全一致，
// 所以在仓库解析这一层换掉主机名即可，不碰 TLS、不用装证书。
//
// 用法：./gradlew -I tools/mirror-neoforged.init.gradle <任务>
// 也可以写进 GRADLE_USER_HOME/init.d/ 让它对所有构建生效。

def mirror = 'https://neoforged.forgecdn.net'
def dead = 'maven.neoforged.net'

// 判断一个仓库是不是我们要改写的那种
def needsRewrite = { repo ->
    try {
        if (!(repo.hasProperty('url'))) {
            return false
        }
        def u = repo.url.toString()
        return u.contains(dead)
    } catch (Throwable ignored) {
        return false
    }
}

// 把 URL 里的主机换掉，其余原样保留
def rewrite = { repo ->
    try {
        def old = repo.url.toString()
        def neu = old.replace(dead, mirror.replace('https://', ''))
        repo.setUrl(neu)
        println "[mirror] ${old}  ->  ${neu}"
    } catch (Throwable t) {
        println "[mirror] 改写失败: ${t}"
    }
}

def fixAll = { repositories ->
    try {
        repositories.findAll { needsRewrite(it) }.each { rewrite(it) }
    } catch (Throwable ignored) {
    }
}

// 插件仓库（settings 阶段就会用到，必须最早下手）
settingsEvaluated { settings ->
    try {
        fixAll(settings.pluginManagement.repositories)
    } catch (Throwable ignored) {
    }
    try {
        fixAll(settings.buildscript.repositories)
    } catch (Throwable ignored) {
    }
}

// 构建脚本自己的仓库
allprojects { p ->
    p.buildscript.repositories.whenObjectAdded { repo -> if (needsRewrite(repo)) rewrite(repo) }
    p.buildscript.repositories.all { repo -> if (needsRewrite(repo)) rewrite(repo) }
    fixAll(p.buildscript.repositories)

    // 项目仓库（依赖解析用）
    p.repositories.whenObjectAdded { repo -> if (needsRewrite(repo)) rewrite(repo) }
    p.repositories.all { repo -> if (needsRewrite(repo)) rewrite(repo) }
    fixAll(p.repositories)

    // 依赖解析时再兜一次：有些插件是在配置阶段之后才加仓库的
    p.afterEvaluate {
        fixAll(p.repositories)
        fixAll(p.buildscript.repositories)
    }
}
