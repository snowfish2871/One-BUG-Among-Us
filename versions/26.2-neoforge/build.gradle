// 26.2 轨道的构建脚本（NeoForge）。
//
// 这个目录是自包含的：源码全在 src/main 下，拷走就能单独构建。
// 源文件由 tools/sync-versions.ps1 从 engine/ 同步过来，别在这里直接改引擎逻辑。
//
// 和 1.20.2 ~ 1.21.1 那几条 NeoForge 轨道不一样：26.x 起 NeoGradle（userdev）不再跟，
// 官方给的构建插件换成了 ModDevGradle，所以这里用 net.neoforged.moddev。
//
// 构建：./gradlew jar

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${archive_suffix}"
}

// 26.2 的类文件是 Java 25
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
    // maven.neoforged.net 在这台机器上连不上，官方 CDN 镜像内容一致
    maven { url = 'https://neoforged.forgecdn.net/releases' }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// 把 ${...} 占位符换成这条轨道自己的值
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                'Main-Class'              : 'dev.oba.Launcher',
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// 游戏外也能直接用这个 jar 跑命令行
tasks.register('runCli', JavaExec) {
    group = 'oba'
    description = '在游戏外跑命令行诊断'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.oba.Launcher'
    systemProperty 'oba.mode', 'cli'
    args = (project.findProperty('cliArgs') ?: 'help').toString().split(' ')
}

tasks.register('dist') {
    group = 'oba'
    description = '构建这条轨道的 jar 并打印路径'
    dependsOn 'jar'
    doLast {
        println "OBA ${mod_version} for Minecraft ${minecraft_version_range} on NeoForge ${neo_version}"
        println "  -> ${tasks.jar.archiveFile.get().asFile.absolutePath}"
    }
}
