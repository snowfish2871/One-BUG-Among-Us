# Gradle 自身
org.gradle.jvmargs=-Xmx3G -Djava.net.preferIPv4Stack=true
systemProp.java.net.preferIPv4Stack=true
systemProp.java.net.preferIPv6Addresses=false
# 首次构建要下几 MB 的 userdev。Java 不读系统代理设置：出包这台机器上浏览器走本地代理，
# 而 Java 直连 maven.minecraftforge.net 只有 ~4 KB/s。如果你的网络也需要代理，把下面几行
# 放开并改成本机端口，同时给上面的 org.gradle.jvmargs 补 -Dhttp(s).proxyHost / -Dhttp(s).proxyPort。
#systemProp.http.proxyHost=127.0.0.1
#systemProp.http.proxyPort=7897
#systemProp.https.proxyHost=127.0.0.1
#systemProp.https.proxyPort=7897
#systemProp.http.nonProxyHosts=localhost|127.0.0.1

# ===========================================================================
# 1.21.1 轨道（Forge）
# ===========================================================================

minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
forge_version=1.21.1-52.1.20
forge_version_range=[52,)

loader_version_range=[52,)

# 产物文件名里带上目标版本，免得几个轨道的 jar 分不清
archive_suffix=mc1.21.1-forge

# ---------------------------------------------------------------------------
# 模组元数据
# ---------------------------------------------------------------------------
mod_id=oba
mod_name=One BUG Among Us
mod_abbr=OBA
mod_license=GPL-3.0-only
mod_version=1.1.0
mod_group_id=dev.oba
mod_authors=OBA contributors
mod_description=One BUG Among Us (OBA) - a crash and error diagnostician for Forge. Watches the log, the game process and the mod list, then names the exact mod file responsible for a failure, the class, method and line where it broke, and what every mod was doing in the moments before it. Also detects MCreator-generated mods and Sodium/Iris forks. Report only: never modifies, disables or deletes anything.